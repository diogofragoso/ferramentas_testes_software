<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Um projeto, duas perspectivas de teste</title><desc id="descricao">OculiX observa a interface. JMeter chama API e pode consultar um banco separado.</desc>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs>
<rect width="1000" height="430" rx="16" fill="#0b1124"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#f1f5f9"><text x="40" y="48" font-size="25" font-weight="700">Um projeto, duas perspectivas de teste</text><rect x="40" y="100" width="260" height="85" rx="12" fill="#17233e" stroke="#4ade80" stroke-width="2"/><text x="58" y="133" font-size="20" fill="#4ade80">OculiX IDE</text><text x="58" y="162" font-size="15">Pixels · OCR · teclado</text><rect x="40" y="280" width="260" height="85" rx="12" fill="#17233e" stroke="#fb923c" stroke-width="2"/><text x="58" y="313" font-size="20" fill="#fb923c">Apache JMeter</text><text x="58" y="342" font-size="15">HTTP · JSON · carga</text><rect x="370" y="100" width="260" height="85" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="388" y="133" font-size="20" fill="#38bdf8">Front-End</text><text x="388" y="162" font-size="15">HTML · React · Vue</text><rect x="370" y="280" width="260" height="85" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="388" y="313" font-size="20" fill="#38bdf8">API REST / JWT</text><text x="388" y="342" font-size="15">Regras · autenticação</text><rect x="710" y="280" width="250" height="85" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="728" y="313" font-size="20" fill="#38bdf8">Banco de dados</text><text x="728" y="342" font-size="15">Opcional: exercício JDBC</text><path d="M300,142 L365,142" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)" fill="none"/><path d="M500,185 L500,275" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)" fill="none"/><path d="M300,322 L365,322" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)" fill="none"/><path d="M630,322 L705,322" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)" fill="none"/><text x="710" y="150" font-size="16">Laboratório incluído:</text><text x="710" y="179" font-size="16">HTML + Python em memória</text><text x="40" y="404" font-size="16">Combine evidências visuais, validações HTTP e medições reproduzíveis.</text></g></svg>