<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Correlação JWT: da resposta ao próximo pedido</title><desc id="descricao">Login retorna token. JSON Extractor guarda uma variável por thread. Header Manager injeta o Bearer.</desc>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs>
<rect width="1000" height="430" rx="16" fill="#0b1124"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#f1f5f9"><text x="40" y="48" font-size="25" font-weight="700">Correlação JWT: da resposta ao próximo pedido</text><rect x="35" y="110" width="275" height="100" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="53" y="143" font-size="20" fill="#38bdf8">1 · POST login</text><text x="53" y="172" font-size="15">usuario + senha</text><rect x="365" y="110" width="275" height="100" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="383" y="143" font-size="20" fill="#38bdf8">2 · JSON Extractor</text><text x="383" y="172" font-size="15">$.token → TOKEN_JWT</text><rect x="695" y="110" width="275" height="100" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="713" y="143" font-size="20" fill="#38bdf8">3 · Header Manager</text><text x="713" y="172" font-size="15">Authorization: Bearer token</text><path d="M310,160 L360,160" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)" fill="none"/><path d="M640,160 L690,160" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)" fill="none"/><rect x="210" y="290" width="580" height="85" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="228" y="323" font-size="20" fill="#38bdf8">4 · GET /api/avaliacoes</text><text x="228" y="352" font-size="15">HTTP 200 com token válido; 401 sem autorização</text><path d="M830,210 L790,290" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)" fill="none"/><text x="40" y="405" font-size="16">Extraia também $.id no cadastro; use IDs da própria thread em GET, PUT e DELETE.</text></g></svg>