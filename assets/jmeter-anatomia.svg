<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Mapa didático da interface JMeter</title><desc id="descricao">Esquema, não captura real: barra de ações, árvore, configuração e resultados.</desc>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs>
<rect width="1000" height="430" rx="16" fill="#0b1124"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#f1f5f9"><text x="40" y="48" font-size="25" font-weight="700">Mapa didático da interface JMeter</text><rect x="30" y="80" width="940" height="65" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="48" y="113" font-size="20" fill="#38bdf8">1 · Barra de ferramentas</text><text x="48" y="142" font-size="15">Iniciar · Stop · Shutdown · Limpar · threads ativas · erros</text><rect x="30" y="165" width="280" height="220" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="48" y="198" font-size="20" fill="#38bdf8">2 · Árvore do plano</text><text x="48" y="227" font-size="15">Test Plan → Thread Group</text><text x="50" y="265" font-size="15">HTTP Defaults / Headers</text><text x="50" y="295" font-size="15">HTTP Request → Extractor</text><text x="50" y="325" font-size="15">Assertions / Listeners</text><rect x="335" y="165" width="635" height="100" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="353" y="198" font-size="20" fill="#38bdf8">3 · Configuração do elemento</text><text x="353" y="227" font-size="15">Ex.: método, servidor, porta, path e Body Data</text><rect x="335" y="285" width="635" height="100" rx="12" fill="#17233e" stroke="#38bdf8" stroke-width="2"/><text x="353" y="318" font-size="20" fill="#38bdf8">4 · Resultados e log</text><text x="353" y="347" font-size="15">Sampler Result · Request · Response Data · logs</text></g></svg>