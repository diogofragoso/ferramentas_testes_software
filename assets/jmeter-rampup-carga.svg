<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Carga gradual, pico e percentis</title><desc id="descricao">Esquema qualitativo de usuários ao longo do tempo; percentis são métricas das respostas, não de usuários.</desc>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs>
<rect width="1000" height="430" rx="16" fill="#0b1124"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#f1f5f9"><text x="40" y="48" font-size="25" font-weight="700">Carga gradual, pico e percentis</text><path d="M80,320 H900 M80,320 V90" stroke="#94a3b8" stroke-width="2" fill="none"/><path d="M90,320 L300,195 L530,195 L570,105 L610,195 L790,195 L860,320" stroke="#4ade80" stroke-width="4" fill="none"/><text x="100" y="95" font-size="16">Usuários virtuais</text><text x="140" y="280" font-size="18">Ramp-up</text><text x="360" y="175" font-size="18">Patamar</text><text x="560" y="85" font-size="18">Pico</text><text x="805" y="350" font-size="16">Tempo →</text><text x="45" y="390" font-size="17">P90 / P95 / P99: limites observados para 90% / 95% / 99% dos tempos de resposta.</text></g></svg>